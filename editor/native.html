<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triccheballacche</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script src="/webui.js"></script>
<script type="module">
// Load the bridge before DOMContentLoaded; reuse the shared editor document and controller.
try {
    const response = await fetch("index.html");
    if (!response.ok) throw Error("Cannot load the editor");
    const page = new DOMParser().parseFromString(await response.text(), "text/html");
    document.body.replaceChildren(...page.body.childNodes);
    const {startEditor} = await import("./main.js");
    await startEditor(await import("./native.js"));
} catch (error) { document.body.textContent = String(error); }
</script>
</html>
