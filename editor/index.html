<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triccheballacche</title>
<link rel="stylesheet" href="style.css">
<script src="/webui.js"></script>
<script type="module" src="main.js"></script>
<nav aria-label="Partitura e riproduzione">
    <button id="run" title="Esegui dall’inizio · Ctrl+Invio" aria-label="Esegui" disabled>▶</button>
    <button id="stop" title="Stop · Esc" aria-label="Stop" disabled>■</button>
    <input id="path" type="text" aria-label="Percorso della partitura" spellcheck="false" placeholder="examples/gui.janet" disabled>
    <span id="modified" title="Modifiche non salvate" aria-label="Modifiche non salvate"></span>
    <button id="open" title="Apri partitura" disabled>Apri</button>
    <button id="save" title="Salva · Ctrl+S" disabled>Salva</button>
    <label title="Mostra le GUI dei plugin"><input id="views" type="checkbox" disabled> GUI</label>
</nav>
<main>
    <div id="sheet">
        <div id="gutter" aria-hidden="true"><pre id="numbers"></pre></div>
        <div id="input">
            <div id="marks" aria-hidden="true"></div>
            <textarea id="code" aria-label="Partitura Janet" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" disabled></textarea>
        </div>
    </div>
    <div id="split" role="separator" aria-label="Altezza della timeline" aria-orientation="horizontal" tabindex="0"></div>
    <section id="timeline" aria-label="Proiezione della partitura">
        <div id="timeline-tools">
            <button id="pan-left" title="Indietro nella vista" aria-label="Indietro nella vista">‹</button>
            <input id="view-start" type="number" min="0" step="any" value="0" aria-label="Inizio della vista in secondi" title="Inizio della vista in secondi">
            <span>s</span>
            <button id="pan-right" title="Avanti nella vista" aria-label="Avanti nella vista">›</button>
            <button id="zoom-out" title="Allontana" aria-label="Allontana">−</button>
            <button id="zoom-in" title="Avvicina" aria-label="Avvicina">+</button>
            <label><input id="follow" type="checkbox" checked> Segui</label>
            <output id="note-info"></output>
        </div>
        <div id="roll"><canvas id="notes" tabindex="0" aria-label="Note della partitura"></canvas><div id="lanes-space" aria-hidden="true"></div></div>
    </section>
    <pre id="errors" role="alert" hidden></pre>
</main>
<footer>
    <span id="state" role="status">Collegamento…</span>
    <output id="time" title="Tempo renderizzato">0.00 s</output>
    <span id="position" title="Riga:colonna">1:1</span>
</footer>
</html>
