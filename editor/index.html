<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triccheballacche</title>
<link rel="stylesheet" href="style.css">
<script src="/webui.js"></script>
<script type="module" src="main.js"></script>
<header>
    <h1>triccheballacche</h1>
    <span id="state" role="status">Collegamento…</span>
    <output id="time">0.00 s</output>
</header>
<nav aria-label="Partitura e riproduzione">
    <label for="path">File</label>
    <input id="path" type="text" spellcheck="false" placeholder="examples/gui.janet" disabled>
    <button id="open" disabled>Apri</button>
    <button id="save" disabled>Salva</button>
    <button id="run" disabled>Esegui</button>
    <button id="stop" disabled>Stop</button>
    <label><input id="views" type="checkbox" disabled> GUI plugin</label>
</nav>
<main>
    <label for="code">Partitura Janet <span id="modified"></span></label>
    <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" disabled></textarea>
    <pre id="errors" role="alert" hidden></pre>
</main>
<footer>
    <span>Ctrl+Invio esegue · Ctrl+S salva · Esc ferma</span>
    <span id="position">Riga 1, colonna 1</span>
</footer>
<p id="hint">Esegui riparte dall’inizio usando il testo attuale. Le modifiche durante l’ascolto valgono alla prossima esecuzione.</p>
</html>
