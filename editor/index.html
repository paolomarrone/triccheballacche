<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triccheballacche</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="start.js"></script>
<nav aria-label="Score and playback">
    <button id="run" title="Run from the start · Ctrl+Enter" aria-label="Run" disabled>▶</button>
    <button id="stop" title="Stop · Esc" aria-label="Stop" disabled>■</button>
    <input id="path" type="text" aria-label="Score path" spellcheck="false" placeholder="examples/gui.janet" disabled>
    <span id="modified" title="Unsaved changes" aria-label="Unsaved changes"></span>
    <button id="open" title="Open score" disabled>Open</button>
    <button id="save" title="Save · Ctrl+S" disabled>Save</button>
    <label id="plugin-views" title="Show plugin UIs"><input id="views" type="checkbox" disabled> GUI</label>
</nav>
<main>
    <div id="workspace">
    <div id="sheet">
        <div id="gutter" aria-hidden="true"><pre id="numbers"></pre></div>
        <div id="input">
            <div id="marks" aria-hidden="true"></div>
            <textarea id="code" aria-label="Janet score" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" disabled></textarea>
        </div>
    </div>
    <aside id="plugins" aria-label="Plugin UI" hidden>
        <div id="plugin-tools">
            <select id="plugin-node" aria-label="Module"></select>
            <select id="plugin-kind" aria-label="UI type">
                <option value="auto">Plugin</option>
                <option value="generic">Parameters</option>
            </select>
        </div>
        <div id="plugin-ui"></div>
    </aside>
    </div>
    <div id="split" role="separator" aria-label="Timeline height" aria-orientation="horizontal" tabindex="0"></div>
    <section id="timeline" aria-label="Score projection">
        <div id="timeline-tools">
            <button id="pan-left" title="Pan left" aria-label="Pan left">‹</button>
            <input id="view-start" type="number" min="0" step="any" value="0" aria-label="View start in seconds" title="View start in seconds">
            <span>s</span>
            <button id="pan-right" title="Pan right" aria-label="Pan right">›</button>
            <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
            <label><input id="follow" type="checkbox" checked> Follow</label>
            <output id="note-info"></output>
        </div>
        <div id="roll"><canvas id="notes" tabindex="0" aria-label="Score notes"></canvas><div id="lanes-space" aria-hidden="true"></div></div>
    </section>
    <pre id="errors" role="alert" hidden></pre>
</main>
<footer>
    <span id="state" role="status">Connecting…</span>
    <output id="time" title="Rendered time">0.00 s</output>
    <span id="position" title="Line:column">1:1</span>
</footer>
</html>
