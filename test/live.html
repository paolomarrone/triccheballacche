<!doctype html>
<meta charset="utf-8">
<title>triccheballacche — prototipo di provenienza</title>
<p>Modifica la partitura e premi Esegui. Ogni esecuzione riparte dall'inizio.</p>
<button id="run" disabled>Esegui</button>
<button id="stop" disabled>Stop</button>
<span id="time">0.00 s</span>
<pre id="status">Caricamento…</pre>
<label for="code">Partitura da eseguire</label><br>
<textarea id="code" rows="18" cols="110" spellcheck="false" disabled></textarea>
<p>Sorgente in ascolto — righe associate agli eventi programmati. Il cursore segue il tempo audio stimato.</p>
<pre id="playing"></pre>
