<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>triccheballacche — miniaudio/Wasm</title>
<button id="run" disabled>Run tests</button>
<pre id="status">Loading…</pre>
<script type="module">
import {createPlayerHost} from "../web/player.js";
import {createHost, addFile} from "../web/host.js";
import {testPlayback, testPlayerExportOptions, testPlayerErrors, testListening} from "./playback.mjs";
import {testPlayerLifecycle} from "./player-lifecycle.mjs";

const button = document.querySelector("#run"), status = document.querySelector("#status");
try {
    if (!crossOriginIsolated) throw Error("Run node test/server.mjs (COOP/COEP headers required).");
    const host = await createPlayerHost({printErr: () => {}}), reference = await createHost();
    for (const path of ["lib/pattern.janet", "lib/trace.janet", "test/schedule.janet", "test/playback.janet",
        "build/fixture.perone/product.json", "build/effect.perone/product.json",
        "build/fixture.perone/wasm32/fixture.wasm", "build/effect.perone/wasm32/fixture.wasm"]) {
        const response = await fetch("../" + path);
        if (!response.ok) throw Error("Cannot load " + path);
        const bytes = new Uint8Array(await response.arrayBuffer());
        await addFile(host, path, bytes);
        await addFile(reference, path, bytes);
    }
    button.disabled = false;
    status.textContent = "Ready: compare offline/miniaudio PCM, then test stop and restart.";
    button.onclick = async () => {
        button.disabled = true;
        try {
            for (const rate of [44100, 48000]) {
                status.textContent = `Playing and checking at ${rate} Hz…`;
                for (const path of ["test/schedule.janet", "test/playback.janet"])
                    await testPlayback(host, reference, path, rate, true);
            }
            await testPlayerExportOptions(host, reference);
            await testListening(host);
            await testPlayerErrors(host);
            status.textContent = "Checking worklet cleanup, errors and timeouts…";
            await testPlayerLifecycle(host);
            await testPlayback(host, reference, "test/playback.janet", 48000);
            status.textContent = "OK: miniaudio/AudioWorklet, identical PCM at 44.1/48 kHz, MIDI, mono/stereo effects, final block, stop and restart.";
        } catch (error) {
            status.textContent = String(error);
        } finally {
            button.disabled = false;
        }
    };
} catch (error) {
    status.textContent = String(error);
}
</script>
</html>
