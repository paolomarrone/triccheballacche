<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Il polpo a sette gomiti — triccheballacche/Wasm</title>
<button id="run" disabled>Play and check Polpo</button>
<pre id="status">Loading…</pre>
<script type="module">
import {createPlayerHost} from "../web/player.js";
import {createHost, addFile} from "../web/host.js";
import {testPlayback} from "./playback.mjs";

const run = document.querySelector("#run");
const status = document.querySelector("#status"), score = "examples/prog/polpo.janet";
try {
    if (!crossOriginIsolated) throw Error("Run node test/server.mjs (COOP/COEP headers required).");
    const host = await createPlayerHost(), reference = await createHost();
    const files = ["lib/music.janet", "lib/pattern.janet", score];
    for (const [plugin, binary] of [["synth_mono", "bw_example_synth_mono"], ["shape", "shape"],
        ["echo", "echo"], ["drums", "drums"]]) {
        const bundle = `plugins/${plugin}/build/plugin.perone`;
        files.push(`${bundle}/product.json`, `${bundle}/wasm32/${binary}.wasm`);
    }
    for (const path of files) {
        const response = await fetch("../" + path);
        if (!response.ok) throw Error("Cannot load " + path + "; build the Perone wasm32 plugins separately.");
        const bytes = new Uint8Array(await response.arrayBuffer());
        await addFile(host, path, bytes);
        await addFile(reference, path, bytes);
    }
    run.disabled = false;
    status.textContent = "Ready: full Polpo score, 30 seconds at 48 kHz. Playback volume reduced for this test.";
    run.onclick = async () => {
        run.disabled = true;
        status.textContent = "Rendering reference audio, then playing and comparing samples…";
        try {
            await testPlayback(host, reference, score, 48000);
            status.textContent = "OK: full Polpo score, PCM identical to the offline Wasm mix at 48 kHz, resources released.";
        } catch (error) {
            status.textContent = String(error);
        } finally {
            run.disabled = false;
        }
    };
} catch (error) { status.textContent = String(error); }
</script>
</html>
